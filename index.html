<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criptare Text în Timp Real</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CryptoJS for encryption (AES) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Custom styling to ensure the page takes full height and has a nice background -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
        }
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl p-6 md:p-8 flex flex-col gap-6 transition-all duration-300">
        
        <!-- Header Section -->
        <header class="text-center mb-2">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Criptare / Decriptare Privată</h1>
            <p class="text-gray-500 text-sm">Procesare în timp real folosind algoritmul AES. Datele tale nu părăsesc acest browser.</p>
        </header>

        <!-- Key Input Section -->
        <div class="flex flex-col gap-2">
            <label for="secret-key" class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 2 2 0 012 2 1 1 0 102 0 4 4 0 00-4-4z" clip-rule="evenodd" />
                </svg>
                Cheie Secretă
            </label>
            <div class="relative">
                <input type="password" id="secret-key" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow outline-none text-gray-800"
                    placeholder="Introduceți cheia pentru criptare/decriptare..." autocomplete="off">
                <button type="button" id="toggle-key-visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-indigo-600 transition-colors">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                        <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                    </svg>
                </button>
            </div>
            <p id="key-warning" class="text-xs text-amber-500 mt-1 hidden">O cheie goală oferă securitate zero. Recomandăm o parolă puternică.</p>
        </div>

        <!-- Text Areas Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Plaintext Input Section -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <label for="plaintext" class="text-sm font-semibold text-gray-700">Text Clar</label>
                    <button id="clear-plaintext" class="text-xs text-gray-500 hover:text-red-500 transition-colors" title="Curăță textul">
                        Curăță
                    </button>
                </div>
                <textarea id="plaintext" rows="10" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none resize-y text-gray-800 bg-gray-50/50"
                    placeholder="Introduceți textul pe care doriți să-l criptați aici..."></textarea>
            </div>

            <!-- Ciphertext Output/Input Section -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <label for="ciphertext" class="text-sm font-semibold text-gray-700">Text Criptat</label>
                    <div class="flex gap-3">
                        <button id="copy-ciphertext" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium transition-colors flex items-center gap-1" title="Copiază textul criptat">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            Copiază
                        </button>
                        <button id="clear-ciphertext" class="text-xs text-gray-500 hover:text-red-500 transition-colors" title="Curăță textul criptat">
                            Curăță
                        </button>
                    </div>
                </div>
                <textarea id="ciphertext" rows="10" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-shadow outline-none resize-y text-gray-800 font-mono text-sm bg-gray-50/50 break-all"
                    placeholder="Rezultatul criptat va apărea aici, sau introduceți text criptat pentru decriptare..."></textarea>
                <p id="decrypt-error" class="text-xs text-red-500 mt-1 hidden">Eroare la decriptare. Cheie greșită sau text corupt.</p>
            </div>
            
        </div>
        
        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    </div>

    <script>
        // DOM Elements
        const keyInput = document.getElementById('secret-key');
        const plaintextArea = document.getElementById('plaintext');
        const ciphertextArea = document.getElementById('ciphertext');
        const keyWarning = document.getElementById('key-warning');
        const decryptError = document.getElementById('decrypt-error');
        
        // Buttons
        const toggleKeyVisibilityBtn = document.getElementById('toggle-key-visibility');
        const eyeIcon = document.getElementById('eye-icon');
        const clearPlaintextBtn = document.getElementById('clear-plaintext');
        const clearCiphertextBtn = document.getElementById('clear-ciphertext');
        const copyCiphertextBtn = document.getElementById('copy-ciphertext');
        const toastContainer = document.getElementById('toast-container');

        // State variables to prevent infinite loops during two-way binding
        let isEncrypting = false;
        let isDecrypting = false;

        // SVG Paths for the eye icon (show/hide password)
        const eyeClosedPath = `<path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" /><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />`;
        const eyeOpenPath = `<path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />`;

        
        /**
         * Encrypts plaintext using the provided key.
         */
        function encryptText() {
            if (isDecrypting) return;
            isEncrypting = true;

            const text = plaintextArea.value;
            const key = keyInput.value;

            // Handle key warning visibility
            if (key.length === 0 && text.length > 0) {
                keyWarning.classList.remove('hidden');
            } else {
                keyWarning.classList.add('hidden');
            }

            if (!text) {
                ciphertextArea.value = '';
                isEncrypting = false;
                return;
            }

            try {
                // Using AES for encryption. Note: if key is empty, it uses an empty string as password, which works but is insecure.
                const encrypted = CryptoJS.AES.encrypt(text, key).toString();
                ciphertextArea.value = encrypted;
                decryptError.classList.add('hidden');
            } catch (error) {
                console.error("Encryption error:", error);
            } finally {
                isEncrypting = false;
            }
        }

        /**
         * Decrypts ciphertext using the provided key.
         */
        function decryptText() {
            if (isEncrypting) return;
            isDecrypting = true;

            const cipher = ciphertextArea.value;
            const key = keyInput.value;

             // Handle key warning visibility
             if (key.length === 0 && cipher.length > 0) {
                keyWarning.classList.remove('hidden');
            } else {
                keyWarning.classList.add('hidden');
            }

            if (!cipher) {
                plaintextArea.value = '';
                decryptError.classList.add('hidden');
                isDecrypting = false;
                return;
            }

            try {
                const decrypted = CryptoJS.AES.decrypt(cipher, key);
                const originalText = decrypted.toString(CryptoJS.enc.Utf8);

                // If originalText is empty but cipher wasn't, it usually means bad key or bad cipher data
                if (originalText === '' && cipher !== '') {
                    throw new Error("Decryption failed. Likely bad key.");
                }

                plaintextArea.value = originalText;
                decryptError.classList.add('hidden');
            } catch (error) {
                // Only show error if we are actively typing in the ciphertext area and it fails
                // Or if we changed the key and the current ciphertext can't be decrypted
                decryptError.classList.remove('hidden');
                // Don't clear plaintext immediately to avoid losing data if user is just typing the key
                // but we clear it if the input in ciphertext is directly invalid
            } finally {
                isDecrypting = false;
            }
        }


        // Event Listeners for real-time processing
        // 'input' event fires on every keystroke, paste, etc.
        plaintextArea.addEventListener('input', encryptText);
        ciphertextArea.addEventListener('input', decryptText);
        
        // When the key changes, we need to decide whether to re-encrypt or re-decrypt.
        // We prioritize re-encrypting the plaintext if it exists.
        keyInput.addEventListener('input', () => {
            if (plaintextArea.value) {
                encryptText();
            } else if (ciphertextArea.value) {
                decryptText();
            } else {
                 keyWarning.classList.add('hidden');
                 decryptError.classList.add('hidden');
            }
        });

        // UI Interactions
        
        // Toggle Password Visibility
        toggleKeyVisibilityBtn.addEventListener('click', () => {
            if (keyInput.type === 'password') {
                keyInput.type = 'text';
                eyeIcon.innerHTML = eyeOpenPath;
            } else {
                keyInput.type = 'password';
                eyeIcon.innerHTML = eyeClosedPath;
            }
        });

        // Clear Plaintext
        clearPlaintextBtn.addEventListener('click', () => {
            plaintextArea.value = '';
            // Trigger encryption (which will clear ciphertext)
            encryptText(); 
            plaintextArea.focus();
        });

        // Clear Ciphertext
        clearCiphertextBtn.addEventListener('click', () => {
            ciphertextArea.value = '';
            // Trigger decryption (which will clear plaintext)
            decryptText();
            ciphertextArea.focus();
        });

        // Copy Ciphertext to Clipboard
        copyCiphertextBtn.addEventListener('click', () => {
            if (!ciphertextArea.value) return;

            // Fallback for older browsers or if clipboard API fails
            ciphertextArea.select();
            ciphertextArea.setSelectionRange(0, 99999); /* For mobile devices */

            try {
                document.execCommand('copy');
                showToast('Text criptat copiat cu succes!', 'success');
            } catch (err) {
                showToast('Nu s-a putut copia textul.', 'error');
            }
            
            // Deselect
            window.getSelection().removeAllRanges();
        });

        
        /**
         * Shows a temporary toast notification
         */
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            
            // Base styles
            toast.className = `flex items-center p-4 mb-4 text-sm rounded-lg shadow-lg transform transition-all duration-300 translate-y-10 opacity-0`;
            
            // Type specific styles
            if (type === 'success') {
                toast.classList.add('text-green-800', 'bg-green-50');
                toast.innerHTML = `
                    <svg class="flex-shrink-0 inline w-4 h-4 me-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
                    </svg>
                    <div><span class="font-medium">${message}</span></div>
                `;
            } else {
                toast.classList.add('text-red-800', 'bg-red-50');
                toast.innerHTML = `
                    <svg class="flex-shrink-0 inline w-4 h-4 me-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z"/>
                    </svg>
                    <div><span class="font-medium">${message}</span></div>
                `;
            }

            toastContainer.appendChild(toast);

            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => {
                    if (toastContainer.contains(toast)) {
                        toastContainer.removeChild(toast);
                    }
                }, 300); // Wait for animation to finish
            }, 3000);
        }

    </script>
</body>
</html>
